<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArenaHub ENGINE | Sports Booking Platform</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2300875a'/><text x='50%25' y='68%25' font-size='20' font-weight='800' fill='white' text-anchor='middle' font-family='sans-serif'>A</text></svg>">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Font: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            arena: {
              50: '#ecfdf5',
              100: '#d1fae5',
              200: '#a7f3d0',
              500: '#10b981',
              600: '#00875a',
              700: '#00704a',
            },
            slateDark: '#0f172a'
          },
          animation: {
            'float-subtle': 'float 3s ease-in-out infinite',
            'pulse-soft': 'pulseSoft 2s ease-in-out infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-6px)' },
            },
            pulseSoft: {
              '0%, 100%': { opacity: '1' },
              '50%': { opacity: '0.6' },
            }
          }
        }
      }
    }
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #ffffff;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* Background dengan radial mint glow halus khas tema referensi */
    .arenahub-splash-bg {
      background: 
        radial-gradient(circle at 50% 30%, rgba(209, 250, 229, 0.6) 0%, rgba(240, 253, 244, 0.25) 45%, #ffffff 80%),
        #ffffff;
    }

    /* Splash Screen Overlay Penuh */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s;
    }

    /* Loading Bar Shimmer */
    .progress-bar-fill {
      transition: width 0.35s ease;
      background: linear-gradient(90deg, #00875a 0%, #10b981 50%, #34d399 100%);
      background-size: 200% 100%;
      animation: shimmer 1.8s infinite linear;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Tampilan Iframe Web App */
    #appFrame {
      display: none;
      width: 100vw;
      height: 100vh;
      border: none;
      background-color: #ffffff;
    }
  </style>
</head>
<body class="arenahub-splash-bg antialiased selection:bg-arena-600 selection:text-white">

  <!-- ========================================================
       SPLASH SCREEN (Muncul sebelum Web Iframe Terbuka)
  ======================================================== -->
  <div id="splash" class="arenahub-splash-bg px-4 sm:px-6">
    
    <div class="max-w-xl w-full flex flex-col items-center text-center animate-float-subtle">
      
      <!-- Brand Logo Badge (ArenaHub + ENGINE Pill) -->
      <div class="flex items-center gap-3 mb-6 bg-white/90 backdrop-blur-md px-5 py-2.5 rounded-2xl border border-slate-200/80 shadow-sm">
        <div class="w-11 h-11 rounded-xl bg-arena-600 flex items-center justify-center text-white shadow-md shadow-arena-600/30 font-extrabold text-2xl tracking-tight">
          A
        </div>
        <div class="flex items-center gap-2">
          <span class="text-slateDark font-extrabold text-xl tracking-tight">ArenaHub</span>
          <span class="text-xs font-bold uppercase tracking-wider bg-emerald-50 text-arena-700 px-2.5 py-0.5 rounded-md border border-emerald-200">
            ENGINE
          </span>
        </div>
      </div>

      <!-- Pill Badge (Persis Foto Referensi) -->
      <div class="inline-flex items-center gap-2 px-4 py-1 rounded-full bg-emerald-50 border border-emerald-200 text-arena-700 text-xs font-semibold mb-4 tracking-wide shadow-2xs">
        <span class="w-2 h-2 rounded-full bg-arena-600 animate-pulse-soft"></span>
        <span>Multi-Tenant Sports Booking Engine</span>
      </div>

      <!-- Main Title -->
      <h1 class="text-3xl sm:text-4xl md:text-[2.6rem] font-extrabold text-slateDark tracking-tight leading-[1.25] mb-3">
        Satu Platform, Banyak Pemilik Lapangan <br class="hidden sm:inline">
        <span class="text-arena-600">&amp; Fasilitas Olahraga</span>
      </h1>

      <!-- Subtitle Description -->
      <p class="text-slate-500 text-sm sm:text-base font-normal max-w-lg leading-relaxed mb-8">
        Solusi cloud booking terisolasi untuk Mini Soccer, Futsal, dan Padel dengan sistem database mandiri.
      </p>

      <!-- Loading Section & Progress Bar -->
      <div class="w-full max-w-xs flex flex-col items-center gap-3">
        <!-- Progress Bar Track -->
        <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden border border-slate-200/90 shadow-inner">
          <div id="loadingProgress" class="progress-bar-fill h-full w-1/5 rounded-full"></div>
        </div>

        <!-- Spinner & Status Text -->
        <div class="flex items-center gap-2.5 mt-1">
          <div class="w-4 h-4 border-2 border-emerald-200 border-t-arena-600 rounded-full animate-spin"></div>
          <span id="loadingText" class="text-xs font-semibold text-slate-500 tracking-wide uppercase">
            Menghubungkan Engine...
          </span>
        </div>
      </div>

    </div>

    <!-- Bottom Architecture Notice -->
    <div class="absolute bottom-6 flex items-center gap-2 text-xs text-slate-400 font-medium">
      <svg class="w-3.5 h-3.5 text-arena-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
      </svg>
      <span>Arsitektur Multi-Tenant Mandiri &amp; Aman</span>
    </div>

  </div>

  <!-- ========================================================
       TARGET WEB IFRAME
       (Ganti URL di src sesuai link web app ArenaHub Anda)
  ======================================================== -->
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbymbnQdO4o5EwVnvnC5dvbRv2qvvPH3FA5w2ZJ-tOQknHCEFrNBG5G0SUnPR1rdL6tmtw/exec"
    allow="clipboard-read; clipboard-write"
    allowfullscreen
    onload="handleFrameReady()">
  </iframe>

  <!-- ========================================================
       CONTROLLER SCRIPT
  ======================================================== -->
  <script>
    let isLoaded = false;
    const splash = document.getElementById("splash");
    const appFrame = document.getElementById("appFrame");
    const progressBar = document.getElementById("loadingProgress");
    const loadingText = document.getElementById("loadingText");

    // Simulasi progres loading bertahap saat menunggu respons iframe
    let progress = 20;
    const progressInterval = setInterval(() => {
      if (progress < 85) {
        progress += Math.floor(Math.random() * 12) + 6;
        if (progress > 85) progress = 85;
        progressBar.style.width = progress + "%";

        if (progress > 45 && progress < 70) {
          loadingText.innerText = "Menginisialisasi Slot & Tenant...";
        } else if (progress >= 70) {
          loadingText.innerText = "Menyiapkan Portal ArenaHub...";
        }
      }
    }, 420);

    // Otomatis menutup Splash Screen ketika Web Iframe selesai termuat
    function handleFrameReady() {
      if (isLoaded) return;
      isLoaded = true;
      clearInterval(progressInterval);

      // Penuhkan bar progress
      progressBar.style.width = "100%";
      loadingText.innerText = "Engine Siap!";

      // Animasi transisi keluar (Fade-Out)
      setTimeout(() => {
        splash.style.opacity = "0";
        splash.style.visibility = "hidden";
        appFrame.style.display = "block";
      }, 500);
    }

    // Safety Timeout: Jika koneksi lambat, layar splash otomatis berganti setelah 8 detik
    setTimeout(() => {
      if (!isLoaded) {
        handleFrameReady();
      }
    }, 8000);
  </script>

</body>
</html>
